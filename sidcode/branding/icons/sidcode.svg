<?xml version="1.0" encoding="UTF-8"?>
<!--
  SidCode's mark.

  A heart in Sid's own Bright Teal palette, on a rounded plate: the plate is what makes it an
  icon rather than a picture - it gives its own background, so it reads the same on a dark dock,
  a light menu and a white web page, and its corners are transparent.

  The shape is deliberately two colours and no detail. Everything an icon has to survive -
  16 pixels in a taskbar, a greyscale printout, a screenshot scaled to half size - destroys
  gloss, highlights and gradients. A photographed heart looks wonderful at 400 pixels and like
  a smudge at 16.

  Sizes are generated from this one file (VSCodium's icons/build_icons.sh does it with
  imagemagick + png2icns), so there is no second drawing to keep in step.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SidCode">
  <defs>
    <!-- Sid's title bar and editor background, from Sid's Bright Teal -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#043432"/>
      <stop offset="1" stop-color="#0b1716"/>
    </linearGradient>
    <!-- Sid's bright teal, with the darker one beneath it for depth -->
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffea"/>
      <stop offset="1" stop-color="#00b3a4"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#plate)"/>

  <g transform="translate(106 104) scale(12.5)">
    <path fill="url(#glow)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </g>
</svg>
